    <script>
      // Suppress benign Vite HMR WebSocket connection errors in AI Studio iframe runtime
      window.addEventListener('unhandledrejection', function (e) {
        var str = String((e && (e.reason && (e.reason.message || e.reason))) || '');
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var str = String((e && (e.message || e.error)) || '');
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
    </script>
